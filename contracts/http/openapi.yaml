      - password_policy_failed
      - validation_failed
      - internal_error
      x-idempotency: required
      responses:
        '202':
          description: Resposta específica da operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAuthBootstrapResponse'
              example:
                data:
                  contract: example
                  operationId: post_auth_bootstrap
        '409':
          description: Falha conforme Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                bootstrap_already_completed:
                  value:
                    type: https://dsgeorref.local/problems/bootstrap_already_completed
                    title: bootstrap already completed
                    status: 409
                    code: bootstrap_already_completed
        '422':
          description: Falha conforme Problem Details.
