components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dsgeorref_session
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque PAT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Revision/ETag precondition.
  schemas:
    PageMeta:
      type: object
      title: PageMeta
      additionalProperties: false
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
          minimum: 1
          maximum: 200
      required:
      - limit
    AcceptedOperation:
      type: object
      title: AcceptedOperation
      additionalProperties: false
      properties:
        operationId: *id001
