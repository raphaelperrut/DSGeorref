                    title: internal error
                    status: 500
                    code: internal_error
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAuthBootstrapRequest'
            example:
              username: example
              password: example
              displayName: example
      x-bounded-context: BC-002
