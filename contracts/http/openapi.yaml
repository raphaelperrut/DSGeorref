openapi: 3.1.0
info:
  title: DSGeorref API
  version: 2.6.0
  description: Contrato normativo e específico por operação. PostgreSQL é autoritativo;
    mutações são idempotentes e revision-aware.
servers:
- url: /api/v1
tags:
- name: API-001
  description: Identidade e sessões
- name: API-002
  description: Projetos, usuários e autorização
- name: API-003
  description: Workspace, roots e assets
- name: API-004
  description: ProcessingPlan e capabilities
- name: API-005
  description: Jobs, attempts e progresso
- name: API-006
  description: Qualidade, SGV e diagnósticos
- name: API-007
  description: Resultados, artifacts e exports
- name: API-008
  description: Revisão e correções
- name: API-009
  description: Providers e aquisição
- name: API-010
  description: Administração e operação
- name: API-011
  description: Backup, retenção e lifecycle
- name: API-012
  description: Release, upgrade e suporte
paths:
  /auth/bootstrap:
