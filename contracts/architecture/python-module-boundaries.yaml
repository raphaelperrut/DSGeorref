schema_version: 1.0.0
runtime:
  primary: '3.12'
  requires_python: '>=3.12,<3.13'
  future_targets:
  - '3.13'
  - '3.14'
limits:
  file_lines:
    preferred: 300
    review: 400
    hard: 600
  function_lines:
    preferred: 40
    review: 60
    hard: 80
  top_level_definitions:
    preferred: 12
    review: 16
    hard: 20
  public_methods_per_class:
    preferred: 10
    review: 15
    hard: 20
  approximate_branch_points:
    preferred: 8
    review: 12
    hard: 15
prohibited_paths:
- src/**/epic-*
- src/**/issue-*
prohibited_generic_modules:
- utils.py
- helpers.py
- common.py
- misc.py
layers:
  backend_domain:
    path: src/backend/dsgeorref/domain
    may_import:
    - backend_domain
  backend_application:
    path: src/backend/dsgeorref/application
    may_import:
    - backend_domain
    - backend_application
  backend_adapters:
    path: src/backend/dsgeorref/adapters
    may_import:
    - backend_domain
    - backend_application
    - backend_adapters
  backend_bootstrap:
    path: src/backend/dsgeorref/bootstrap
    may_import:
    - backend_domain
    - backend_application
    - backend_adapters
    - backend_bootstrap
    - geo_public
    - ai_public
  geo_public:
    path: src/geo/dsgeorref_geo
    may_import:
    - geo_public
  ai_public:
    path: src/ai/dsgeorref_ai
    may_import:
    - ai_public
    - geo_public
exceptions:
  file: docs/02-architecture/design-reviews/PYTHON_ARCHITECTURE_EXCEPTIONS.yaml
  approval_roles:
  - Arquiteto
  - Reviewer
baseline_version: 2.6.0
architecture: bounded-context-first
