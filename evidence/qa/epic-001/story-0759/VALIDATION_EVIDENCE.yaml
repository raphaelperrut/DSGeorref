limitations_and_residual_risks:
  - The matrix targets published STORY-0003 end-to-end boundaries and does not duplicate the full implementation-unit suite.
  - Local evidence covers CPython 3.12.10 on Windows; the approved workflow remains the Linux/CPython 3.12.13 integration surface.
  - A Git commit cannot embed its own SHA without a circular content dependency; the exact final QA candidate SHA is bound in the implementation handoff after commit creation.

