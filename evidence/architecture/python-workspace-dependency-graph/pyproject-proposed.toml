[project]
name = "dsgeorref"
version = "0.0.0"
description = "DSGeorref greenfield modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic==1.18.4", "celery==5.6.3", "cryptography==50.0.1", "psycopg[binary]==3.3.6", "pyjwt==2.15.0", "sqlalchemy==2.1.2"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_reexport = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[dependency-groups]
dev = ["jsonschema==4.26.0", "mypy==2.3.1", "pyyaml==6.0.3", "ruff==0.16.9"]
test = ["pytest==9.1.1"]

[tool.uv]
package = false
default-groups = []
constraint-dependencies = ["amqp==5.4.1", "ast-serialize==0.12.1", "attrs==26.1.0", "billiard==4.3.1", "cffi==2.1.1", "click==8.5.0", "click-didyoumean==0.3.1", "click-plugins==1.1.1.2", "click-repl==0.4.1", "iniconfig==2.3.0", "jsonschema-specifications==2025.9.1", "kombu==5.6.2", "librt==0.16.0", "mako==1.4.3", "markupsafe==3.0.3", "mypy-extensions==1.1.0", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.6.0", "prompt-toolkit==3.0.53", "pycparser==3.0", "pygments==2.21.0", "python-dateutil==2.9.0.post0", "referencing==0.37.0", "rpds-py==2026.9.1", "six==1.17.0", "typing-extensions==4.16.0", "tzdata==2026.5", "tzlocal==5.4.4", "vine==5.1.0", "wcwidth==0.9.2"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and python_full_version == '3.12.13'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and python_full_version == '3.12.13'"]
