limitations:
- independent QA and Reviewer approval for the exact candidate commit remain pending and are not claimed
- make verify requires FOUNDATION_INTEGRATION=1 plus pinned PostgreSQL and RabbitMQ for its preexisting walking-skeleton test
- local Node is 22 rather than the repository pin 24.20.0; the hosted workflow pins Python 3.12.13 and has no Node dependency
residual_risks:
- hosted Actions and package-index availability remain external dependencies and fail the workflow when unavailable
- the STORY-0027 validator hashes raw checkout bytes and reports CRLF drift on Windows; this automation verifies canonical LF bytes so Git content is portable
validation:
