fail_closed_coverage:
- missing required control
- unknown property
- optional property addition at root, controls, or workflow, and new profile version
- wrong BC-001 authority
- missing or mismatched GitHub reconciliation
- unordered or incomplete forecast
- non-exact snapshot variance
- missing producer or consumer contract
- incompatible checkpoint
- unknown workflow state
- unregistered workflow transition
- collapsed core, API, or runners boundary
- attempted runtime materialization
- missing ownership registration or referenced contract
contract_impact:
  type: NEW_VERSIONED_PUBLIC_CONTRACT
  shared_contracts_modified: false
  shared_contracts_referenced: true
  boundary: POLICY_CONFORMANCE_DTO_ONLY
  leaked_internals: false
  http: NOT_APPLICABLE
  persistence: NOT_APPLICABLE
  migration: NOT_APPLICABLE
  operational_rollback: NOT_APPLICABLE
  contract_rollback: REVERT_BEFORE_CONSUMPTION_OR_PUBLISH_NEW_VERSION
changed_files_justification:
  task_envelope: authorize only mandatory omitted paths
  contract_files: publish the minimum versioned profile and positive example
  ownership_registry: register every new BC-001 public contract file
  design_review: record local compatibility, authority, boundary, and rollback decisions
  tests: prove positive contract behavior and fail-closed negatives
  evidence: bind ACs, requirements, validations, limitations, and residual risks
limitations:
- This story is declarative and does not implement runtime backlog automation.
- Independent Reviewer approval remains pending for the same candidate commit.
- Full local make verify depends on pinned PostgreSQL and RabbitMQ services supplied by CI.
residual_risks:
- Consumers must pin a version they actually accept; major matching alone does not
  establish compatibility with new properties.
- Referenced BC-001 contracts must retain their published compatibility guarantees.
- Local Node 22.14.0 emitted an engine warning; CI is configured for pinned Node 24.20.0.
