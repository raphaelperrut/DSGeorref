  domain_taxonomy.py: reject registry/index drift and malformed codes
  backlog_validation.py: validate the current backlog/issue invariants without adapters or runtime state
  test_backlog_governance.py: implement nine mandatory tests plus one focused fail-closed test
  IMPLEMENTATION_EVIDENCE.yaml: bind requirements, ACs, validation, scope and handoff
