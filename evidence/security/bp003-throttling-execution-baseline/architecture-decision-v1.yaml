value_authority_rationale:
  hardware.classification:
    value: reference_benchmark; no minimum_supported claim
    authority: TASK-0770 / STORY-0767; CAPACITY_AND_SCALING classes of test
    rationale: Resolves reversible experimental sizing; BP-003 minimum-supported production gate remains open.
  hardware.cpu:
    value: x86_64 AMD EPYC 7313P; 4 physical cores; nominal 3000 MHz; no boost/SMT; 2 API + 2 PostgreSQL
    authority: ROLE-002 technical choice delegated by TASK-0770, not a measured capacity fact
    rationale: One explicit CPU model eliminates model selection; isolates password CPU from authoritative state updates.
  hardware.ram:
    value: 16 GiB host; API 4 GiB; PostgreSQL 8 GiB; OS/measurement 4 GiB; no swap
    authority: TASK-0770 reversible reference sizing; TECHNOLOGY_BASELINE quotas evidence-bound
    rationale: Bounded CPU-only experiment with separate database allocation and explicit memory headroom; no support claim.
  hardware.storage:
    value: Dedicated local NVMe/ext4; 100 GiB free; durable WAL/fsync; no shared I/O
    authority: CAPACITY_AND_SCALING local filesystem authority and NVMe test classes; frozen PostgreSQL authority
    rationale: Isolate persistent throttle/audit write pressure; free space is experiment admission, not product minimum.
  hardware.gpu_runtime:
    value: GPU not required; Linux/cgroup v2; signed OCI/Compose; CPython 3.12.13; PostgreSQL 18.x
    authority: CAPACITY_AND_SCALING CPU-only; TECHNOLOGY_BASELINE pinning/deployment
    rationale: Exact build/OS/device pins are execution fingerprints; no dependency or security profile changes.
  workload.operations:
    value: post_auth_session only, existing POST /auth/session, 202 and rate_limited mapping
    authority: Frozen EPIC-008 throttling guard and TASK-0770 bounded authentication workload
    rationale: Password guessing exercises local session authentication; other operations require separate evidence, not invented coverage.
  workload.fixtures:
    value: 16 legitimate + 8 attacked + 3 probe accounts; 8 missing identities; 16 legitimate/32 abusive origins
    authority: TASK-0770 architect-defined experimental cardinality
    rationale: Isolated legitimate controls, matched existence pairs and three pre-existing throttle states; synthetic data only.
  workload.rates:
    value: 2 legitimate rps; 40 repeated rps; 160 brute-force rps; max in-flight 8 + 512
    authority: TASK-0770 architect-defined load; THREAT_MODEL CPU/resource abuse; BP-003 brute-force/DoS question
    rationale: Twenty- and eighty-fold offered abuse relative to control; finite four-fold escalation tests persistence and resource pressure.
  workload.schedule:
    value: Warmup 60 s; baseline 120 s; repeated 300 s; distributed 300 s; recovery 120 s; 1 s samples/60 s windows; 3 repetitions
    authority: TASK-0770 reproducibility and observation design
    rationale: Warm caches before baseline; two control windows, five windows per attack, two recovery windows; independent repeatability check.
  workload.transport:
    value: Timeout 2000 ms; p99 scheduling lag <= 10 ms; all scheduled requests dispatched
    authority: TASK-0770 experimental scheduling/concurrency
    rationale: 512 attacker slots exceed 160 rps * 2 s timeout; generator saturation cannot masquerade as suppression.
  workload.security:
    value: Zero bypass/invalid successes/leaks; authoritative state + restart preservation; <=10 percent verifier calls in last attack window
    authority: Frozen throttling section; REQ-AUTH-IMPL-007; AP-003 floors; BP-003 abuse resistance
    rationale: Require observable persistent enforcement and measurable expensive-work suppression; percentage is a candidate rejection criterion.
  workload.enumeration:
    value: Identical canonical errors for equal guard/state facts; paired median/p95 difference <=20 percent with >=30 samples
    authority: AP-003 no enumeration and frozen first-failing-guard errors
    rationale: Compare like states without remapping account_locked; timing tolerance is an experimental screen, not universal proof of absence of side channels.
  workload.resource_dos:
    value: CPU <=80 percent/60 s; memory API<=3 GiB/DB<=7 GiB/sum<=10 GiB; success>=99 percent/window; p95<=1000 ms and <=2x baseline
    authority: TASK-0770 reversible acceptance design; BP-003 absence of CPU/memory operational DoS
    rationale: Retain 20 percent CPU and 25/12.5 percent API/DB memory headroom; reject loss of isolated legitimate service and non-recovery; no product SLO.
  workload.fault_probes:
    value: Six state/restart probes, three authority-unavailable probes; 30 s restart deadline; 2000 ms request timeout
    authority: Frozen throttling restart/authority fail-closed semantics
    rationale: Observe persisted states and absence of fallback, after performance timeline; no benchmark is run in TASK-0770.
