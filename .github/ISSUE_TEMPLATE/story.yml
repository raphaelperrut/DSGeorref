name: Story
description: Registrar uma história implementável vinculada a um épico
title: "[STORY] "
labels: []
body:
  - type: input
    id: stable-id
    attributes:
      label: Stable ID
      placeholder: ISSUE-0000 / STORY-0000
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Epic pai
      placeholder: EPIC-000 ou #123
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Valor e resultado esperado
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo e limites
      description: Inclua caminhos permitidos/proibidos e invariantes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação verificáveis
    validations:
      required: true
  - type: textarea
    id: adrs
    attributes:
      label: ADRs e contratos aplicáveis
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Riscos e caminhos de falha
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Testes obrigatórios
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidência exigida para conclusão
    validations:
      required: true
  - type: dropdown
    id: migration
    attributes:
      label: Aplicabilidade de migração
      options:
        - Aplicável
        - Não aplicável
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Plano de rollback ou justificativa de não aplicabilidade
    validations:
      required: true
