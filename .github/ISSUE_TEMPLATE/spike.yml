name: Spike
about: Investigação time-boxed com decisão e evidência explícitas
title: "[SPIKE] "
labels: []
body:
  - type: textarea
    id: question
    attributes:
      label: Pergunta decisória
      description: Qual incerteza precisa ser reduzida?
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: 4 horas / 2 dias
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas a comparar
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências e método
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Critério de parada e saída esperada
      description: ADR, benchmark, decisão de não prosseguir ou issue refinada.
    validations:
      required: true
