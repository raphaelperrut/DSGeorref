name: foundation-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    env:
      FOUNDATION_INTEGRATION: "1"
      FOUNDATION_DATABASE_URL: postgresql://foundation:foundation@127.0.0.1:5432/foundation
      FOUNDATION_BROKER_URL: amqp://guest:guest@127.0.0.1:5672//
      FOUNDATION_API_URL: http://127.0.0.1:8765
      FOUNDATION_ARTIFACT_DIR: /tmp/issue-0122-artifacts
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: foundation
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundation -d foundation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the exact OpenAPI comparison base
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/bootstrap_openapi_base.py

      - name: Prove base bootstrap is fail-closed
        run: python -m unittest discover -s tests/fnd/ci -p 'test_openapi_base.py'

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Show Python version
        run: python --version

      - name: Install foundation validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-validation.txt

      - name: Install frontend validation dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright browser
        run: pnpm --filter @dsgeorref/frontend-tooling exec playwright install --with-deps chromium

      - name: Verify repository
        run: make verify

      - name: Verify DCO for external contribution
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python -X utf8 tools/governance/license-citation-cff-contribuicao-dco-cla-e-gate-de-pu/foundation_validation.py
          --technical --commit-range "$BASE_SHA..$HEAD_SHA"

      - name: Verify identity, authorization and migrations on disposable PostgreSQL
        env:
          PYTHONPATH: src/backend
          IDENTITY_TEST_DSN: postgresql://foundation:foundation@127.0.0.1:5432/local_identity_validation
          IDENTITY_MIGRATION_DSN: postgresql+psycopg://foundation:foundation@127.0.0.1:5432/local_identity_validation
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["FOUNDATION_DATABASE_URL"], autocommit=True) as connection:
              connection.execute("CREATE DATABASE local_identity_validation")
          PY
          python -m venv "$RUNNER_TEMP/identity-tests"
          source "$RUNNER_TEMP/identity-tests/bin/activate"
          python -m pip install --disable-pip-version-check pytest==9.1.1 \
            -r src/backend/dsgeorref/contexts/identity_access/adapters/local_identity/requirements.txt
          python -m pytest -q -p no:cacheprovider \
            tests/backend/identity_access/local_identity/test_requirements.py \
            tests/backend/identity_access/local_identity/test_identity_requirements.py \
            tests/backend/identity_access/local_identity/test_slice_consolidation.py::test_oidc_session_can_issue_and_revoke_pat \
            tests/security/contexts/identity_access

      - name: Check whitespace errors
        run: git diff --check
