name: foundation-security

on:
  workflow_dispatch:
  pull_request:

jobs:
  secret-pattern-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tracked environment files
        run: |
          test ! -f .env
          ! git ls-files | grep -E '(^|/)(id_rsa|id_ed25519|.*\.pem|.*\.key)$'
