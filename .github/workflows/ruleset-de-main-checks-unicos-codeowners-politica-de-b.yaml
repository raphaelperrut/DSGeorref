name: epic-091-main-ruleset-controls

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-main-ruleset-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate ISSUE-0672 controls in dry-run mode
        run: >-
          python
          tools/quality/contexts/engineering_governance/ruleset-de-main-checks-unicos-codeowners-politica-de-b/validator.py
          --dry-run

      - name: Prove deterministic and fail-closed automation
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/fnd/ruleset-de-main-checks-unicos-codeowners-politica-de-b/test_automation.py::test_epic_091_automacao

      - name: Validate ISSUE-0673 repository-flow integration
        run: >-
          python -X utf8
          tools/governance/ruleset-de-main-checks-unicos-codeowners-politica-de-b/integration_validation.py

      - name: Prove ISSUE-0673 integration and failure modes
        run: >-
          python -X utf8 -m pytest -q -p no:cacheprovider
          tests/fnd/ruleset-de-main-checks-unicos-codeowners-politica-de-b/test_integration.py::test_epic_091_integracao
