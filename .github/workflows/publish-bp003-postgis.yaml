name: Publish BP-003 PostgreSQL/PostGIS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after independent review and environment approval
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bp003-postgis-publisher
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE: docker.io/kartoza/postgis@sha256:ee01a9755ba8fbb54a462ca137f3e79a71c5662b7decb45127d8a24eb2475ee6
  PACKAGE: ghcr.io/raphaelperrut/dsgeorref-bp003-postgis
  CERTIFICATE_IDENTITY: https://github.com/raphaelperrut/DSGeorref/.github/workflows/publish-bp003-postgis.yaml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'raphaelperrut/DSGeorref' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - &install_oras
        name: Install checksum-pinned ORAS
        run: |
          tools="$RUNNER_TEMP/bp003-tools"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location \
            https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz \
            --output "$tools/oras.tar.gz"
          echo "f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454  $tools/oras.tar.gz" | sha256sum --check
          tar -xzf "$tools/oras.tar.gz" -C "$tools" oras
          echo "$tools" >> "$GITHUB_PATH"

      - name: Verify the source manifest and platform
        run: |
          mkdir -p evidence
          oras manifest fetch --output evidence/source-manifest.json "$SOURCE"
          test "sha256:$(sha256sum evidence/source-manifest.json | cut -d' ' -f1)" = "${SOURCE##*@}"
          jq -e '.mediaType == "application/vnd.oci.image.manifest.v1+json" and (.layers | length > 0)' \
            evidence/source-manifest.json > /dev/null
          config_digest="$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' evidence/source-manifest.json)"
          oras blob fetch --output evidence/source-config.json "${SOURCE%@*}@$config_digest"
          test "sha256:$(sha256sum evidence/source-config.json | cut -d' ' -f1)" = "$config_digest"
          jq -e '.os == "linux" and .architecture == "amd64"' evidence/source-config.json > /dev/null

      - name: Install checksum-pinned Syft and Grype
        run: |
          tools="$RUNNER_TEMP/bp003-tools"
          curl --fail --silent --show-error --location \
            https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz \
            --output "$tools/syft.tar.gz"
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $tools/syft.tar.gz" | sha256sum --check
          tar -xzf "$tools/syft.tar.gz" -C "$tools" syft
          curl --fail --silent --show-error --location \
            https://github.com/anchore/grype/releases/download/v0.122.1/grype_0.122.1_linux_amd64.tar.gz \
            --output "$tools/grype.tar.gz"
          echo "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538  $tools/grype.tar.gz" | sha256sum --check
          tar -xzf "$tools/grype.tar.gz" -C "$tools" grype

      - name: Inventory licenses and check installed package versions
        env:
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          syft scan "registry:$SOURCE" --platform linux/amd64 \
            -o "syft-json=$RUNNER_TEMP/source.syft.json" -o "spdx-json=evidence/sbom.spdx.json"
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' evidence/sbom.spdx.json > /dev/null
          jq -e --arg source "$SOURCE" '
            def required($name; $version):
              [.artifacts[] | select(.type == "deb" and .name == $name and (.version | test($version)))]
              | if length == 1 then .[0] | {name, version} else error("Unexpected package inventory: " + $name) end;
            {source: $source, platform: "linux/amd64", packages: [
              required("postgresql-18"; "^18\\.4($|[+~-])"),
              required("postgresql-18-postgis-3"; "^3\\.6\\.4($|[+~-])")
            ]}' "$RUNNER_TEMP/source.syft.json" > evidence/compatibility.json

      - name: Gate on high or critical vulnerabilities
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          grype "sbom:$RUNNER_TEMP/source.syft.json" --fail-on high \
            --output json --file evidence/vulnerabilities.json

      - name: Upload source and scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bp003-postgis-validation-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.repository == 'raphaelperrut/DSGeorref' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: bp003-postgis-release
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Require the approved deployment SHA
        env:
          # Define only on bp003-postgis-release after architecture, security and license review.
          APPROVED_SHA: ${{ vars.BP003_POSTGIS_APPROVED_SHA }}
        run: |
          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ || "$APPROVED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Set BP003_POSTGIS_APPROVED_SHA in the protected environment after review."
            exit 1
          fi
          test "$GITHUB_WORKFLOW_REF" = "${CERTIFICATE_IDENTITY#https://github.com/}"

      - *install_oras

      - name: Install checksum-pinned Cosign
        run: |
          tools="$RUNNER_TEMP/bp003-tools"
          curl --fail --silent --show-error --location \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            --output "$tools/cosign"
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $tools/cosign" | sha256sum --check
          chmod 0755 "$tools/cosign"

      - name: Retrieve evidence from the same workflow attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bp003-postgis-validation-${{ github.run_attempt }}
          path: evidence/

      - name: Verify preflight evidence before authenticating
        run: |
          test "sha256:$(sha256sum evidence/source-manifest.json | cut -d' ' -f1)" = "${SOURCE##*@}"
          test -s evidence/sbom.spdx.json
          test -s evidence/vulnerabilities.json
          jq -e --arg source "$SOURCE" '.source == $source and .platform == "linux/amd64"' \
            evidence/compatibility.json > /dev/null

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Copy and verify the manifest bytes by digest
        id: copy
        run: |
          expected="${SOURCE##*@}"
          image="$PACKAGE@$expected"
          oras cp "$SOURCE" "$image"
          oras manifest fetch --output evidence/published-manifest.json "$image"
          cmp evidence/source-manifest.json evidence/published-manifest.json
          actual="sha256:$(sha256sum evidence/published-manifest.json | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "IMAGE_REF=$PACKAGE@$actual" >> "$GITHUB_ENV"

      - name: Record provenance for the registry copy
        run: |
          digest="${IMAGE_REF##*@}"
          config="$(jq -er '.config.digest' evidence/source-manifest.json)"
          workflow="https://github.com/${GITHUB_WORKFLOW_REF%@*}@${GITHUB_SHA}"
          invocation="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          jq -n --arg package "$PACKAGE" --arg digest "${digest#sha256:}" \
            --arg source "${SOURCE%@*}" --arg config "${config#sha256:}" \
            --arg workflow "$workflow" --arg commit "$GITHUB_SHA" --arg invocation "$invocation" '{
            _type: "https://in-toto.io/Statement/v1",
            subject: [{name: $package, digest: {sha256: $digest}}],
            predicateType: "https://slsa.dev/provenance/v1",
            predicate: {
              buildDefinition: {
                buildType: "https://github.com/raphaelperrut/DSGeorref/.github/workflows/publish-bp003-postgis.yaml#oci-copy",
                externalParameters: {source: $source, destination: $package, platform: "linux/amd64"},
                internalParameters: {environment: "bp003-postgis-release", upstreamBuildAuthenticated: false},
                resolvedDependencies: [
                  {uri: $source, digest: {sha256: $digest}, annotations: {configSha256: $config}},
                  {uri: $workflow, digest: {gitCommit: $commit}}
                ]
              },
              runDetails: {builder: {id: $workflow}, metadata: {invocationId: $invocation}}
            }
          }' > evidence/provenance.intoto.json

      - name: Attach, sign and verify OCI evidence and image
        working-directory: evidence
        run: |
          sign_and_verify() {
            local reference="$1" label="$2"
            cosign sign --yes --bundle "$label.bundle.json" "$reference"
            cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger workflow_dispatch --output json "$reference" \
              > "$label.verification.json"
            jq -e '.verificationMaterial.tlogEntries | any(.inclusionProof.checkpoint.envelope | type == "string" and length > 0)' \
              "$label.bundle.json" > /dev/null
          }

          attach_and_verify() {
            local file="$1" media_type="$2" label="$3" digest manifest blob
            oras attach --artifact-type "$media_type" --format json "$IMAGE_REF" "$file:$media_type" \
              > "$label.attach.json"
            digest="$(jq -er '(.digest // .manifest.digest // .descriptor.digest) | select(test("^sha256:[0-9a-f]{64}$"))' "$label.attach.json")"
            manifest="$(oras manifest fetch "$PACKAGE@$digest")"
            blob="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            jq -e --arg subject "${IMAGE_REF##*@}" --arg type "$media_type" --arg blob "$blob" '
              .subject.digest == $subject and .artifactType == $type
              and (.layers | length == 1 and .[0].digest == $blob and .[0].mediaType == $type)
            ' <<< "$manifest" > /dev/null
            sign_and_verify "$PACKAGE@$digest" "$label"
          }

          attach_and_verify sbom.spdx.json application/spdx+json sbom
          attach_and_verify provenance.intoto.json application/vnd.in-toto+json provenance
          sign_and_verify "$IMAGE_REF" image
          printf 'Verified OCI image: %s\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain verification evidence
        if: ${{ !cancelled() && steps.copy.outcome != '' && steps.copy.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bp003-postgis-publication-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
