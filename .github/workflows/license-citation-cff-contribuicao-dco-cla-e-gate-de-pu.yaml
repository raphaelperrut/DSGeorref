name: epic-007-license-publication-governance-controls

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate publication governance controls read-only
        run: >-
          python
          tools/quality/contexts/engineering_governance/license-citation-cff-contribuicao-dco-cla-e-gate-de-pu/validator.py
          --dry-run

      - name: Verify DCO for external contribution
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python
          tools/quality/contexts/engineering_governance/license-citation-cff-contribuicao-dco-cla-e-gate-de-pu/validator.py
          --dry-run
          --external-commit-range "$BASE_SHA..$HEAD_SHA"

      - name: Prove deterministic and fail-closed automation
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/fnd/license-citation-cff-contribuicao-dco-cla-e-gate-de-pu/test_automation.py::test_epic_007_automacao
