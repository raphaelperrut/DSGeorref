name: epic-090-issue-form-governance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-issue-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate Issue Forms with the local entry point
        run: >-
          python
          tools/governance/issue-forms-templates-e-taxonomia-de-tipos-com-validac/validate_issue_forms.py
          --repository-root .

      - name: Prove required fields and fail-closed behavior
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/fnd/issue-forms-templates-e-taxonomia-de-tipos-com-validac/test_foundation.py
