name: epic-006-capability-catalog-controls

on:
  pull_request:
    paths:
      - ".codex/tasks/TASK-0028.json"
      - "contracts/contexts/engineering_governance/fnd/catalogo-de-conhecimento-tecnico-e-decomposicao-das-ca/**"
      - "docs/03-engineering/contexts/engineering_governance/catalogo-de-conhecimento-tecnico-e-decomposicao-das-ca/**"
      - "tools/governance/catalogo-de-conhecimento-tecnico-e-decomposicao-das-ca/**"
      - "tools/quality/contexts/engineering_governance/catalogo-de-conhecimento-tecnico-e-decomposicao-das-ca/**"
      - "tests/fnd/catalogo-de-conhecimento-tecnico-e-decomposicao-das-ca/**"
      - ".github/workflows/catalogo-de-conhecimento-tecnico-e-decomposicao-das-ca.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate EPIC-006 controls read-only
        run: >-
          python
          tools/quality/contexts/engineering_governance/catalogo-de-conhecimento-tecnico-e-decomposicao-das-ca/validator.py
          --dry-run

      - name: Prove deterministic and fail-closed automation
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/fnd/catalogo-de-conhecimento-tecnico-e-decomposicao-das-ca/test_automation.py::test_epic_006_automacao
