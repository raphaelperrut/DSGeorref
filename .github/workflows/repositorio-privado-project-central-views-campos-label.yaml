name: engineering-foundation-contract-validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frozen-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate frozen engineering foundation contracts
        run: >-
          python
          tools/quality/contexts/engineering_governance/repositorio-privado-project-central-views-campos-label/validator.py
          --dry-run

      - name: Prove deterministic and fail-closed automation
        run: >-
          python -c
          "import runpy;
          runpy.run_path('tests/fnd/repositorio-privado-project-central-views-campos-label/test_automation.py')['test_epic_002_automacao']()"

      - name: Validate repository integration
        run: >-
          python
          tools/governance/repositorio-privado-project-central-views-campos-label/repository_integration.py

      - name: Prove requirement traceability and fail-closed integration
        run: >-
          python -c
          "import runpy;
          tests = runpy.run_path('tests/fnd/repositorio-privado-project-central-views-campos-label/test_integration.py');
          [tests[name]() for name in
          ('test_req_classicprofile_006', 'test_req_classicprofile_008',
          'test_req_classicprofile_0010', 'test_req_native_001',
          'test_req_native_004', 'test_epic_002_integracao')]"
