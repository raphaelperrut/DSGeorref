name: epic-005-migrations-ci-scans-telemetry-controls

on:
  pull_request:
    paths:
      - ".codex/tasks/TASK-0023.json"
      - "**/migrations/**"
      - "config/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".gitleaks.toml"
      - "contracts/contexts/engineering_governance/fnd/migrations-ci-secret-dependency-scan-e-telemetria-mini/**"
      - "docs/03-engineering/contexts/engineering_governance/migrations-ci-secret-dependency-scan-e-telemetria-mini/**"
      - "evidence/operations/epic-005/**"
      - "tools/governance/migrations-ci-secret-dependency-scan-e-telemetria-mini/**"
      - "tools/quality/contexts/engineering_governance/migrations-ci-secret-dependency-scan-e-telemetria-mini/**"
      - "tests/fnd/migrations-ci-secret-dependency-scan-e-telemetria-mini/**"
      - ".github/workflows/migrations-ci-secret-dependency-scan-e-telemetria-mini.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate EPIC-005 controls read-only
        run: >-
          python
          tools/quality/contexts/engineering_governance/migrations-ci-secret-dependency-scan-e-telemetria-mini/validator.py
          --dry-run

      - name: Prove deterministic and fail-closed automation
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/fnd/migrations-ci-secret-dependency-scan-e-telemetria-mini/test_automation.py::test_epic_005_automacao

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit pinned Python validation dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-validation.txt
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.26.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Audit pinned Node dependencies
        run: pnpm audit --audit-level high
