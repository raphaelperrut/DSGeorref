name: epic-003-foundation-controls

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-foundation-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate EPIC-003 foundation controls read-only
        run: >-
          python
          tools/quality/contexts/engineering_governance/monorepo-greenfield-com-cli-api-web-minimos-e-checks-r/validator.py
          --dry-run

      - name: Prove deterministic and fail-closed automation
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/fnd/monorepo-greenfield-com-cli-api-web-minimos-e-checks-r/test_automation.py::test_epic_003_automacao
