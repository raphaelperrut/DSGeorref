name: engineering-governance-contract-validation

on:
  pull_request:
    paths:
      - ".codex/tasks/TASK-0001.json"
      - ".codex/tasks/TASK-0004.json"
      - "contracts/contexts/engineering_governance/**"
      - "docs/03-engineering/contexts/engineering_governance/**"
      - "tools/governance/governanca-de-decisoes-arquiteturais-e-manutencao-da-b/**"
      - "tools/quality/contexts/engineering_governance/governanca-de-decisoes-arquiteturais-e-manutencao-da-b/**"
      - "tests/fnd/governanca-de-decisoes-arquiteturais-e-manutencao-da-b/**"
      - ".github/workflows/governanca-de-decisoes-arquiteturais-e-manutencao-da-b.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-frozen-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: requirements-validation.txt

      - name: Show Python version
        run: python --version

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-validation.txt

      - name: Validate engineering governance contracts
        run: >-
          python
          tools/quality/contexts/engineering_governance/governanca-de-decisoes-arquiteturais-e-manutencao-da-b/validator.py

      - name: Run frozen contract validation
        run: >-
          python -c
          "import runpy;
          runpy.run_path('tests/fnd/governanca-de-decisoes-arquiteturais-e-manutencao-da-b/test_contract.py')['test_epic_001_contrato']()"

      - name: Validate repository integration
        run: >-
          python
          tools/governance/governanca-de-decisoes-arquiteturais-e-manutencao-da-b/repository_integration.py

      - name: Run repository integration test
        run: >-
          python -c
          "import runpy;
          runpy.run_path('tests/fnd/governanca-de-decisoes-arquiteturais-e-manutencao-da-b/test_integration.py')['test_epic_001_integracao']()"
